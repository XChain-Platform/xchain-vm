# FINAL - the slim per-repo replacement for .github/workflows/ci.yml
# Drop this into each npm repo. It does nothing but delegate to the shared definition.
# Pinned to a commit SHA (not @master) so a change to the shared reusable workflow
# only reaches this repo when the SHA is bumped deliberately. See the uses: line below.
name: CI

# Least privilege for the default GITHUB_TOKEN: every job here only reads the repo.
permissions:
  contents: read

on:
  push:
    # develop is where all work lands; master only ever receives release PRs.
    # Both run the gate: develop so a lane push is verified as it lands, master
    # so the merge commit a release tag points at has its own green run.
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: XChain-Platform/.github/.github/workflows/ci-reusable.yml@6f4d39ae85787fc31e90a31588d87610a2c33103 # pin: XChain-Platform/.github @ master 2026-08-14; bump deliberately
    with:
      # On a release or hotfix PR, check the siblings out at the PR's own
      # branch so a release-branch-only change to a file a cross-repo guard
      # reads is tested against the train, not against develop. The shared
      # workflow otherwise pins siblings at develop for any pull request,
      # which is what let this repo's release PRs go red on commits that
      # touch neither the guard nor the file it reads. Empty everywhere
      # else, which keeps the existing behaviour. Same expression as
      # xchain-indexer and xchain-explorer.
      siblings-ref: ${{ (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')) && github.head_ref || '' }}
    # Override the Node version for a repo if ever needed:
    # with:
    #   node-version: "20"

  # Coverage ratchet: re-run the unit suite under c8 and fail if line or
  # branch coverage drops below this repo's floor in bin/coverage-thresholds.json
  # (mirrored into the `coverage:check` npm script). Catches silent coverage
  # regression the pass/fail gate cannot see: a change that keeps every test green
  # while deleting the only test that reached a file. These are RATCHET FLOORS
  # (~1-1.5 points below measured), not tier targets; raise them as coverage climbs.
  coverage:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The ratchet re-runs the unit suite, so it needs the same siblings the gate
      # gets. Without them the guards that read a sibling skip silently, so the
      # ratchet measures a suite the gate never ran: 795 of 812 unit tests ran without them.
      # Same roster (.ci-siblings) and same layout the shared workflow uses.
      - name: Check out declared sibling repositories
        uses: XChain-Platform/.github/actions/checkout-siblings@master # one definition for every call site; see the action for why this tracks master
        # The ratchet re-runs the unit suite, so it needs the same release/hotfix
        # awareness as the gate's own siblings-ref above, or it measures a suite
        # whose cross-repo guards disagree with the gate for a reason that exists
        # nowhere but in CI.
        with:
          ref: ${{ (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')) && github.head_ref || '' }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Coverage thresholds (c8 --check-coverage)
        run: npm run coverage:check
