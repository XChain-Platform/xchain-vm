name: musl-security

permissions:
  contents: read

on:
  push:
    branches: [master, develop]
    paths:
      - .github/workflows/musl-security.yml
      - package.json
      - package-lock.json
      - src/**
      - test/security/**
      - test/determinism/**
  pull_request:
    branches: [master, develop]
    paths:
      - .github/workflows/musl-security.yml
      - package.json
      - package-lock.json
      - src/**
      - test/security/**
      - test/determinism/**
  schedule:
    - cron: "0 8 * * 3"
  workflow_dispatch:

jobs:
  musl-security:
    runs-on: ubuntu-latest
    container:
      image: node:22.22.3-alpine@sha256:e58326d0d441090181ac150dc2078d3e2cf6a0d42e809aebba3ef5880935ffdd
    timeout-minutes: 30
    steps:
      - name: Install build toolchain
        run: apk add --no-cache bash python3 make g++ git

      - uses: actions/checkout@v4

      - name: Check out declared sibling repositories
        uses: XChain-Platform/.github/actions/checkout-siblings@master
        with:
          ref: ${{ (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')) && github.head_ref || '' }}

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild isolated-vm --build-from-source

      - name: Check consensus runtime
        run: |
          node - <<'NODE'
          const { checkConsensusRuntime, describeMismatch } = require('./src/consensus-runtime');
          const result = checkConsensusRuntime();
          if (!result.ok) {
            console.error(describeMismatch(result));
            process.exit(1);
          }
          NODE

      - name: Run security tests
        run: npm run test:security

      - name: Run determinism tests
        run: npm run test:determinism
