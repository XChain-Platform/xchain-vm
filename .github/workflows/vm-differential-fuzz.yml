# VM differential-fuzz gate.
#
# The VM's consensus contract is BIT-IDENTICAL execution on every validator,
# whatever the arch / Node ABI / libc. The shared CI gate (ci.yml) only runs
# the suite on one runner, so it can never SEE a cross-build divergence. This
# workflow closes that gap: it regenerates the identical seeded fuzz corpus on
# every leg of an arch/build matrix, records each leg's per-case consensus
# hashes, then diffs every leg against the x86_64/glibc reference. A single
# hash disagreement means two validator builds would fork, and fails the run.
#
# The corpus is a pure function of DIFF_SEED, so each leg samples the SAME
# inputs independently and only the output hashes are compared (see
# test/fuzz/helpers/differential.js). Bump DIFF_CASES for a deeper sweep on demand.
#
# Each leg records two profiles. "legacy" is the historical pre-gate corpus.
# "post-gate" re-runs it past the F-NR block-time gate and the musl-safe height
# gate, plus fixed depth cases at the 256 bound, which is where a musl thread
# stack can fork from glibc (test/fuzz/helpers/differential_postgate.js). Every
# leg also runs the depth security suites on its own libc.
#
# Every leg is pinned to the consensus runtime (src/consensus-runtime.js) and
# records refuse an off-pin engine or an off-pin consensus dependency
# (isolated-vm, mathjs, decimal.js, acorn, acorn-walk, astring). The diff job asserts the exact leg set and
# each leg's platform identity before comparing, so a dropped leg or a lost
# container stanza fails the run instead of shrinking it.
name: vm-differential-fuzz

# Least privilege for the default GITHUB_TOKEN: every job here only reads the repo.
permissions:
  contents: read

on:
  # Not on every push (isolated-vm rebuild + subprocess corpus is heavy). Pushes
  # and PRs run it only when a file that decides cross-build consensus changes:
  # the runtime pin, the depth bounds, the isolate depth globals, the activation
  # gates, the lockfile, or this harness. Work lands on develop by direct push as
  # well as by PR, so both triggers carry the same path list.
  push:
    branches: [master, develop]
    paths:
      - .github/workflows/vm-differential-fuzz.yml
      - package.json
      - package-lock.json
      - src/consensus-runtime.js
      - src/index/constants.js
      - src/index/runtime/isolate_globals.js
      - src/index/runtime/activation_heights.js
      - src/index/runtime/activations.js
      - test/fuzz/helpers/**
      - test/security/musl_stack_depth_gate.test.js
      - test/security/native_recursion_depth.test.js
  pull_request:
    branches: [master, develop]
    paths:
      - .github/workflows/vm-differential-fuzz.yml
      - package.json
      - package-lock.json
      - src/consensus-runtime.js
      - src/index/constants.js
      - src/index/runtime/isolate_globals.js
      - src/index/runtime/activation_heights.js
      - src/index/runtime/activations.js
      - test/fuzz/helpers/**
      - test/security/musl_stack_depth_gate.test.js
      - test/security/native_recursion_depth.test.js
  # On demand, and weekly so a toolchain/V8 bump that shifts one build's
  # numerics is caught before it reaches the fleet.
  workflow_dispatch:
    inputs:
      cases:
        description: "cases per corpus (default 200)"
        required: false
        default: "200"
      seed:
        description: "corpus seed (default 1480804417)"
        required: false
        default: "1480804417"
  schedule:
    # Tuesdays 06:00 UTC, offset from the Monday audit cadence.
    - cron: "0 6 * * 2"

# A new push to the same PR cancels its stale run; push, schedule and dispatch
# runs each get their own group, so they are never cancelled.
concurrency:
  group: vm-differential-fuzz-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  DIFF_SEED: ${{ github.event.inputs.seed || '1480804417' }}
  DIFF_CASES: ${{ github.event.inputs.cases || '200' }}

jobs:
  # One leg per (arch, build). Each records its own manifest artifact. The
  # x86_64/glibc leg is the reference every other leg is diffed against.
  record:
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-x64-glibc      # reference
            runner: ubuntu-latest
            container: ""
            libc: glibc
          - leg: linux-arm64-glibc    # cross-ARCH
            runner: ubuntu-24.04-arm
            container: ""
            libc: glibc
          - leg: linux-x64-musl       # cross-BUILD (musl libc)
            runner: ubuntu-latest
            # The pinned engine release, by digest so a re-tag cannot move it.
            container: node:22.22.3-alpine@sha256:e58326d0d441090181ac150dc2078d3e2cf6a0d42e809aebba3ef5880935ffdd
            libc: musl
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The alpine container ships the pinned Node already; the bare runners
      # need it. The alpine leg builds isolated-vm from source, so it needs tools.
      - name: Install build toolchain (musl leg only)
        if: ${{ matrix.libc == 'musl' }}
        run: apk add --no-cache python3 make g++ git

      # Pinned to the consensus runtime; a floating "22" resolves to a release
      # the runtime gate refuses (see ci.yml).
      - name: Use Node.js 22.22.3
        if: ${{ matrix.container == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      # Build isolated-vm from source so the native V8 binding matches THIS
      # leg's arch/libc (a prebuild from another arch would be the very drift
      # this job exists to detect, or simply fail to load). npm ci installs the
      # lockfile exactly, so every leg compares the same pinned dependency tree.
      - name: Install deps (rebuild isolated-vm from source)
        run: |
          npm ci --ignore-scripts
          npm rebuild isolated-vm --build-from-source

      - name: Record differential manifest
        run: |
          node test/fuzz/helpers/differential_run.js record \
            --seed "$DIFF_SEED" --cases "$DIFF_CASES" --require-pinned-runtime \
            --out "differential.${{ matrix.leg }}.json"

      - name: Record post-gate differential manifest
        run: |
          node test/fuzz/helpers/differential_run.js record \
            --seed "$DIFF_SEED" --cases "$DIFF_CASES" --require-pinned-runtime \
            --profile post-gate \
            --out "differential-postgate.${{ matrix.leg }}.json"

      - name: Upload manifests
        uses: actions/upload-artifact@v4
        with:
          name: differential-${{ matrix.leg }}
          path: |
            differential.${{ matrix.leg }}.json
            differential-postgate.${{ matrix.leg }}.json
          if-no-files-found: error
          retention-days: 14

      # The depth gate and native-recursion suites on this leg's own libc and
      # arch; the shared CI gate runs them on one glibc runner only. Both suites
      # skip when the engine cannot load, so --forbid-pending turns a skip red.
      - name: Depth security suites
        run: >-
          npx mocha --timeout 60000 --forbid-pending
          test/security/musl_stack_depth_gate.test.js
          test/security/native_recursion_depth.test.js

  record-arm64-musl:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Record ARM64 musl manifests and run depth suites
        run: |
          docker run --rm \
            --env DIFF_SEED --env DIFF_CASES \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            node:22.22.3-alpine@sha256:e58326d0d441090181ac150dc2078d3e2cf6a0d42e809aebba3ef5880935ffdd \
            sh -ec '
              apk add --no-cache python3 make g++ git
              npm ci --ignore-scripts
              npm rebuild isolated-vm --build-from-source
              node test/fuzz/helpers/differential_run.js record \
                --seed "$DIFF_SEED" --cases "$DIFF_CASES" --require-pinned-runtime \
                --out differential.linux-arm64-musl.json
              node test/fuzz/helpers/differential_run.js record \
                --seed "$DIFF_SEED" --cases "$DIFF_CASES" --require-pinned-runtime \
                --profile post-gate \
                --out differential-postgate.linux-arm64-musl.json
              npx mocha --timeout 60000 --forbid-pending \
                test/security/musl_stack_depth_gate.test.js \
                test/security/native_recursion_depth.test.js
            '

      - name: Upload manifests
        uses: actions/upload-artifact@v4
        with:
          name: differential-linux-arm64-musl
          path: |
            differential.linux-arm64-musl.json
            differential-postgate.linux-arm64-musl.json
          if-no-files-found: error
          retention-days: 14

  # Diff every leg against the x86_64/glibc reference. Any per-case consensus
  # hash divergence exits non-zero here and fails the gate.
  diff:
    needs: [record, record-arm64-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      # compare only diffs already-recorded JSON manifests (no VM execution,
      # so isolated-vm need not build from source here), but differential.js
      # itself requires fast-check/acorn/astring, so those still need to be
      # on disk before the compare step below can run at all.
      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Download all manifests
        uses: actions/download-artifact@v4
        with:
          path: manifests
          pattern: differential-*
          merge-multiple: true

      # Every expected leg must be present, distinct, on the pinned engine and
      # the platform it is named for; a missing leg is a failure, not a skip.
      - name: Check the leg set
        run: |
          set -e
          for p in legacy post-gate; do
            node test/fuzz/helpers/differential_run.js check-legs manifests \
              --seed "$DIFF_SEED" --cases "$DIFF_CASES" --profile "$p"
          done

      - name: Diff each build against the x86_64/glibc reference
        run: |
          set -e
          divergence=0
          crash=0
          for prefix in differential differential-postgate; do
            REF="manifests/${prefix}.linux-x64-glibc.json"
            test -f "$REF" || { echo "reference manifest missing: $REF"; exit 1; }
            for leg in linux-arm64-glibc linux-x64-musl linux-arm64-musl; do
              m="manifests/${prefix}.${leg}.json"
              echo "::group::compare $(basename "$m") vs reference"
              out="$(node test/fuzz/helpers/differential_run.js compare "$REF" "$m" 2>&1)" && rc=0 || rc=$?
              printf '%s\n' "$out"
              if [ "$rc" -ne 0 ]; then
                if printf '%s\n' "$out" | grep -q 'DIFFERENTIAL DIVERGENCE:'; then
                  divergence=1
                else
                  crash=1
                fi
              fi
              echo "::endgroup::"
            done
          done
          if [ "$crash" -ne 0 ]; then
            echo "::error::VM differential fuzz tool crashed before it could render a verdict (see the compare group's output above); this is not a consensus divergence"
            exit 1
          fi
          if [ "$divergence" -ne 0 ]; then
            echo "::error::VM differential fuzz found a cross-build consensus divergence"
            exit 1
          fi
          echo "all builds are consensus-identical over the fuzz corpus"
